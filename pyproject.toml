[project]
name = "agent-loop"
version = "0.4.0"
description = "Autonomous coding-agent runner: GitHub issue auto-fix, run locally in Docker. Python + LangGraph."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # LangChain 1.x: the agent loop is langchain.agents.create_agent; langgraph
    # stays a direct dependency for the outer StateGraph pipelines.
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-deepseek>=0.1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
agent-loop = "agent_loop.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_loop"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
