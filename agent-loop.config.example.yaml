# agent-loop source configuration.
#
# Each entry under `sources` is one GitHub repo instance with a unique `id`.
# Secrets are NOT stored here — reference them as ${ENV_VAR} and keep the actual
# values in .env. Copy this file to agent-loop.config.yaml and edit. Override the
# path with the AGENT_LOOP_CONFIG env var.

sources:
  # ── GitHub: polls a repo and acts on labelled issues ──
  - type: github
    id: goals-app
    repo: owner/goals-app
    labels: { bug: bug, feature: enhancement, question: question }
    pollIntervalSec: 120
    autoMerge: false                      # auto-merge green PRs that pass the policy
    requireApproval: true                 # + also require human approval before merging
    approveLabel: auto-merge              # approval = this label on the PR (or an approving review)
    gitAttribution: true                  # false: no "agent-loop" trailer in commits / PR bodies
    cloneDir: ./data/repos
    policy:
      allowedGlobs: [src/**, public/**, docs/**, e2e/**, tests/**]
      maxChangedLines: 300
    # Commands run by the verify node. Any red → loop back to implement (bounded).
    # Mirror what the repo's CI runs, and order them cheapest-first: verify stops
    # at the first failure, so a red lint shouldn't wait for the e2e suite.
    verifyCommands:
      - npm run lint
      - npm run build
      - npx playwright test
    # Run those commands once on the base branch first, before anything is
    # written: a suite that is already red there (no database, no API key in the
    # container) cannot be the change's fault, so it is skipped when verifying
    # the diff and named in the PR body instead of eating all three fix cycles.
    # Costs one extra pass over the suite per task — set false where too slow.
    baselineVerify: true
    # Optional security scanners run by the diff-security node (after the critic).
    # Any non-zero exit is treated as a finding and loops back to implement. The
    # node also always does an LLM security review of the diff, so this may be
    # left empty. Example:
    # securityCommands:
    #   - npm audit --audit-level=high
    #   - npx semgrep --error --config auto
    # Opt-in Docker: agent Bash/build/tests run inside this image via docker
    # exec. Omit the whole block to execute on the host instead. Use a
    # Playwright image so e2e browsers are present.
    # Note the container has its OWN localhost: a database published on the host
    # is not reachable as `localhost` from inside it. Reach the host gateway and
    # pass the connection string the repo's tests read, e.g.
    #   runArgs:
    #     - --add-host=host.docker.internal:host-gateway
    #     - -e
    #     - TEST_DATABASE_URL=postgres://user:pass@host.docker.internal:5432/app_test
    container:
      image: mcr.microsoft.com/playwright:v1.50.0-noble
      # runArgs: ["--network", "host"]

  # ── A second GitHub repo = just another instance (host execution here) ──
  # - type: github
  #   id: other-app
  #   repo: owner/other-app
  #   autoMerge: true
  #   policy:
  #     allowedGlobs: [app/**, lib/**]
  #     maxChangedLines: 150
