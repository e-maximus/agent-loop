# Bootstrap PR CI for a Node/npm target repo (lint + build).
# open-claw's auto-merge gates on THIS workflow being green.
# Copy to the target repo as .github/workflows/ci.yml and adjust the scripts.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
