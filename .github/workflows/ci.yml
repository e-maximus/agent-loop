name: CI

# Required check for merging into main. The prod watcher deploys straight from
# main, so a red main means a bad release rolls out to the machine.
on:
  pull_request:
  push:
    branches: [main]

# Nothing here needs to write to the repo. Least privilege by default: a
# compromised action in the dependency tree gets a read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The dependency set this release was tested against; the deploy watcher
  # installs with the same file, so CI proves what actually ships.
  PIP_CONSTRAINT: constraints.txt

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA: a tag can be moved, and this workflow
      # runs on pull_request from forks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: pyright
      # Fully mocked — no network, LLM, or Docker.
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing
      # Catches an import-time break (a bad module-level statement, a circular
      # import) that the mocked suite can miss. Needs the env vars config.py
      # validates at import, and a config path it will not try to read.
      - name: Smoke import
        env:
          DEEPSEEK_API_KEY: ci-smoke-test
          AGENT_LOOP_CONFIG: /dev/null
          DB_PATH: ${{ runner.temp }}/smoke.db
        run: python -c "import agent_loop.main"

  # The release bump belongs to auto-release.yml, which applies it on main after
  # the merge. A PR that edits the line itself is how every other open PR gets a
  # conflict, and how two PRs merged in the wrong order ship the same version.
  #
  # The `release:manual` label switches this off, for the one case the rule
  # cannot cover: a release run that never landed its bump, leaving main behind
  # what it has actually shipped. Someone then has to move the line by hand, and
  # the label is that decision written down where the diff is reviewed.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version must not be hand-edited
        env:
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The labels are read now rather than taken from the event payload: the
        # payload is frozen when the run starts, so a label added to fix a red
        # check would not be seen until someone pushed a commit to re-trigger.
        # Read at run time, re-running the job is enough.
        #
        # The diff is from the merge base, not from the tip of the base branch:
        # every merge lands a bump on main, so comparing against the tip would
        # fail every branch that is merely a release behind.
        run: |
          if gh pr view "$PR" --json labels -q '.labels[].name' | grep -qx 'release:manual'; then
            echo "release:manual — the version line may be edited in this PR"
            exit 0
          fi
          git fetch --no-tags origin "$BASE"
          if git diff "origin/$BASE...HEAD" -- pyproject.toml | grep -q '^[-+]version = '; then
            echo "::error file=pyproject.toml::this PR edits the version line. Revert it and set the level with a release:minor / release:major label instead — the merge bumps the version on main. If a release run was lost and main must be moved by hand, label the PR release:manual."
            exit 1
          fi
          echo "ok: the version line is untouched"
