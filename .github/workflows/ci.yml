name: CI

# Required check for merging into main. The prod watcher deploys straight from
# main, so a red main means a bad release rolls out to the machine.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Fully mocked — no network, LLM, or Docker.
      - run: python -m pytest -q
